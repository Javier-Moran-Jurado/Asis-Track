app:
  api:
    version: v1
  version: 1.0.0
  security:
    jwt:
      secret-key: ${SECRET_KEY:fallback}
      expiration: 86400000
      refresh-token:
        expiration: 604800000
    integration:
      url: ${SECURITY_URL:http://localhost:8085}
      secret: ${INTERNAL_SECRET:microservice-internal-secret}
  ai:
    primary: ${AI_PRIMARY_PROVIDER:hf}
    cloud:
      model: ${AI_CLOUD_MODEL:gpt-4o-mini}
    hf:
      url: ${HF_URL:https://router.huggingface.co/zai-org/api/paas/v4/layout_parsing}
      token: ${HF_TOKEN:}
    ollama:
      model: ${OLLAMA_MODEL:ocr-masivo}
    groq:
      url: ${GROQ_URL:https://api.groq.com/openai/v1}
      token: ${GROQ_TOKEN:}
      model: ${GROQ_MODEL:llama-3.2-90b-vision-preview}

logging:
  level:
    com.zaxxer.hikari: ERROR
    org.hibernate: ERROR
    org.hibernate.SQL: DEBUG
    org.springframework: ERROR
    root: ERROR
    web: INFO

management:
  endpoints:
    web:
      exposure:
        include: '*'
  server:
    port: ${PLANILLA_PORT_ACTUATOR:8081}

server:
  port: ${PORT:8080}
  # ── Timeouts de Tomcat al m\u00e1ximo para llamadas largas de IA/OCR ──
  # Sincronizado con proxy_read_timeout de Nginx (600s = 10 min)
  tomcat:
    connection-timeout: 600000       # 600 s en ms: espera para que el cliente envíe la request
    async-timeout: 600000            # 600 s en ms: max espera de tareas asíncronas (@Async)
    keep-alive-timeout: 600000       # 600 s en ms: mantiene la conexión HTTP Keep-Alive viva

spring:
  application:
    name: MicroservicioPlanilla

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_HOST}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      initialization-fail-timeout: 60000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  main:
    allow-circular-references: true

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USER:default}

  session:
    store-type: redis

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:dummy-key}

# S3 / Supabase configuration (populated from environment)
s3:
  endpoint: ${S3_ENDPOINT:}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRECT_ACCESS_KEY:}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:}
  public-base-url: ${S3_PUBLIC_BASE_URL:}
  presign-ttl-seconds: ${S3_PRESIGN_TTL:3600}