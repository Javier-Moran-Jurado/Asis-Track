<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App de seguimiento de asistencia">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">

  <script>
    // Forzar actualización del Service Worker al cargar la página
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) {
          registration.update();
          if (registration.waiting) {
            registration.waiting.postMessage({type: 'SKIP_WAITING'});
          }
        });
      });
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AsisTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AsisTrack</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services (OAuth2) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <meta name="google-signin-client_id" content="655549064856-hn07fp0osk2c2luodfo679020gt4od1d.apps.googleusercontent.com">

  <script>
    window.googleIdToken = null;

    function initGoogleSignIn() {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
        setTimeout(initGoogleSignIn, 100);
        return;
      }
      google.accounts.id.initialize({
        client_id: '655549064856-hn07fp0osk2c2luodfo679020gt4od1d.apps.googleusercontent.com',
        callback: handleCredentialResponse,
        auto_select: false,
        cancel_on_tap_outside: true,
        // Deshabilitar FedCM para evitar el polling infinito de "status?client_id="
        // que bloquea el inicio de sesión en navegadores modernos (Chrome 120+).
        use_fedcm_for_prompt: false,
        ux_mode: 'popup'
      });
    }

    function handleCredentialResponse(response) {
      window.googleIdToken = response.credential;
      window.dispatchEvent(new Event('google-signin-success'));
    }

    window.addEventListener('load', initGoogleSignIn);
  </script>
</head>
<body>
  <script src="env-config.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
